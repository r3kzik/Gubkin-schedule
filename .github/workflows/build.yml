name: Сборка MyGub Beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Показать ошибки сборки
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk mygub-beta.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: mygub-beta-apk
          path: mygub-beta.apk

      - name: Опубликовать релиз (удобно скачивать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: MyGub Beta 2.1.${{ github.run_number }}
          body: "🧪 Тестовая версия MyGub с новыми функциями. Ставится РЯДОМ с основным приложением (отдельная иконка MyGub Beta). Может содержать ошибки. Скачайте **mygub-beta.apk** ниже."
          files: mygub-beta.apk
          prerelease: true
          make_latest: false
