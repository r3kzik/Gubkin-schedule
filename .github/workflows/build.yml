name: Сборка MyGub Lite

on:
  push:
    branches: [lite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk mygub-lite.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: mygub-lite-apk
          path: mygub-lite.apk

      - name: Опубликовать релиз (удобно скачивать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-${{ github.run_number }}
          name: MyGub Lite 1.0.${{ github.run_number }}
          body: "Лёгкая версия MyGub без эффектов и анимаций. Ставится рядом с основным приложением. Скачайте **mygub-lite.apk** ниже."
          files: mygub-lite.apk
          make_latest: false
