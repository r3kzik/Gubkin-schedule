name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk raspisanie.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: raspisanie.apk

      - name: Опубликовать релиз (удобно скачивать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Расписание 1.0.${{ github.run_number }}
          body: Скачайте raspisanie.apk ниже и установите на телефон.
          files: raspisanie.apk
          make_latest: true
